    relationships:
      - {type: has_one, target: Stream, via: query selector}
  - name: Tenant
    description: >-
      The isolation boundary. Not an addressable resource — there is no tenant CRUD API. A tenant
      exists because a request carried its ID in X-Scope-OrgID (or in the Basic auth user field on
      Grafana Cloud).
    identified_by: 'X-Scope-OrgID header value'

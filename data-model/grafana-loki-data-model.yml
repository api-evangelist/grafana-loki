    source: 'GET /loki/api/v1/index/stats; logproto.proto IndexStatsResponse'
    fields: [streams, chunks, entries, bytes]
  - name: Pattern
    description: A detected recurring log line structure with its sample counts over time.
    source: 'GET /loki/api/v1/patterns'
  - name: DetectedField
    description: A field discovered inside log lines, with its inferred type and cardinality.
    source: 'GET /loki/api/v1/detected_fields, GET /loki/api/v1/detected_field/{name}/values'
  - name: RuleGroup
    description: >-
      A named group of alerting and recording rules inside a namespace, Prometheus-shaped with LogQL

name: Grafana Loki packages and distributions
description: >-
  Grafana Loki is distributed as server software, not as a set of client SDKs. Every first-party
  package below is either the Loki server, an operational component of it, or the Go module that
  defines the push contract. Grafana Labs publishes NO first-party HTTP client library for Loki in
  any language: the documented integration paths are the HTTP API directly, LogCLI, and a log
  collection agent (Grafana Alloy). Registry currency is recorded per entry as structured
  version/published fields read from each registry's metadata endpoint.
first_party_client_sdks: 1
first_party_client_sdk_languages: [go]
first_party_client_sdk_note: >-
  The only first-party client-side library is github.com/grafana/loki/pkg/push — the Go module that
  defines and marshals the push contract, which is what a Go log producer imports to speak to Loki.
  There is no first-party client SDK in any other language: Loki's documentation offers Python HTTP
  examples ("Query Loki with Python") rather than a package, and every language-specific Loki client
  on npm/PyPI (winston-loki, python-logging-loki, loki-logger) is community-maintained by an
  individual, not by Grafana Labs, so none is credited here as official.

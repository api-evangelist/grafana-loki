currency_finding: >-
  The Loki server, LogCLI, Loki Canary and the supported Helm chart are all current (August 2026).
  The decay is concentrated exactly where Grafana Labs has publicly deprecated something: Promtail
  (May 2026), the loki-distributed / loki-stack / promtail Helm charts (October 2025, pinned to Loki
  2.9), and the Docker logging driver plugin (October 2024). That pattern is a deprecation signal
  rather than an abandonment signal, and it lines up with lifecycle/grafana-loki-lifecycle.yml.

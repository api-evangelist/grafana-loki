apis:
- aid: grafana-loki:loki-http-api
  name: Loki HTTP API
  description: >-
    The Grafana Loki HTTP API — 40 documented endpoints for pushing logs (native and OTLP),
    querying with LogQL over instants and ranges, discovering labels, series, patterns and detected
    fields, streaming a live tail over WebSocket, managing Prometheus-shaped alerting and recording
    rule groups, submitting and cancelling log deletion requests, and reading component status and
    ring state. Loki is self-hosted software, so the base host is whichever address the operator
    binds; the documented default port is 3100 and TLS is terminated by the operator or a fronting
    proxy. Authorization is explicitly not part of this API.
  humanURL: https://grafana.com/docs/loki/latest/reference/loki-http-api/
  baseURL: http://{loki-host}:3100
  tags:
  - Logs
  - Logging
  - Observability
  - LogQL
  - OpenTelemetry

- aid: grafana-loki:grafana-cloud-logs-api
  name: Grafana Cloud Logs API
  description: >-
    Grafana Cloud Logs is the fully managed Grafana Loki service. It serves the same Loki HTTP API
    on a per-stack host of the form logs-prod-<cluster>.grafana.net, authenticated with HTTP Basic
    where the username is the tenant and the password is an access policy token carrying logs:read,
    logs:write or logs:delete. A free tier allows 50 GB of ingest per month with 14 day retention.
  humanURL: https://grafana.com/docs/grafana-cloud/send-data/logs/
  baseURL: https://logs-prod-{cluster}.grafana.net
  tags:
  - Logs
  - Observability
  - Managed Service
  properties:
  - type: Documentation
    url: https://grafana.com/docs/grafana-cloud/send-data/logs/
  - type: APIReference
    url: https://grafana.com/docs/loki/latest/reference/loki-http-api/
  - type: Pricing
    url: https://grafana.com/pricing/
- aid: grafana-loki:grafana-mcp-loki-tools
  name: Grafana MCP Server — Loki tools
  description: >-
    Grafana Loki reaches MCP clients through the Grafana Labs MCP servers, which register a Loki
    tool family (query_loki_logs, list_loki_label_names, list_loki_label_values, query_loki_stats,
    query_loki_patterns, analyze_loki_labels, suggest_loki_alloy_label_config). The hosted Grafana
    Cloud MCP server answers at https://mcp.grafana.com/mcp over streamable HTTP with OAuth 2.1;
    the open source grafana/mcp-grafana server runs locally over stdio, SSE or streamable HTTP.
  humanURL: https://grafana.com/docs/grafana-cloud/ai-tools/mcp-servers/cloud-mcp/
  baseURL: https://mcp.grafana.com/mcp
  tags:
  - MCP

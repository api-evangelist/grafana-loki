aid: grafana-loki
name: Grafana Loki
description: >-
  Grafana Loki is Grafana Labs' open source log aggregation system — "like Prometheus, but for
  logs." Rather than full-text indexing log contents, Loki indexes only a small set of labels per
  log stream and stores the compressed lines in object storage, which is what makes it cheap to run
  at scale. It is queried with LogQL, a Prometheus-inspired query language, over an HTTP API that
  covers ingestion, querying, label and pattern discovery, live tailing over WebSocket, a
  Prometheus-compatible ruler for alerting and recording rules, and a cancellable log deletion API.
  Loki accepts native pushes and OpenTelemetry OTLP/HTTP logs, publishes proto3 gRPC service
  definitions for its push and query paths, and ships a first-party CLI (LogCLI), Helm charts, a
  Kubernetes operator, and Docker images. It is licensed AGPL-3.0 and self-hosted; the same engine
  is sold as the managed Grafana Cloud Logs service and as the self-managed Grafana Enterprise Logs
  distribution.

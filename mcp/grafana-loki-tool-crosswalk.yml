name: Grafana Loki MCP-to-API tool crosswalk
description: >-
  Binds each Loki MCP tool exposed by the Grafana Labs MCP servers to the Loki HTTP endpoint (and,
  where one exists, the gRPC RPC) that backs it. Grafana Loki publishes no OpenAPI, so the `rest`
  column carries the documented HTTP method + path from the Loki HTTP API reference rather than an
  operationId; `grpc` carries the RPC name from the published protobuf service definitions.
surfaces:
  openapi:
    present: false
    note: >-
      Grafana Loki publishes no OpenAPI/Swagger document. Probed for one on grafana.com
      (/openapi.json, /swagger.json — HTTP 404 SPA shell) and scanned the full grafana/loki git tree
      (21,041 paths): the only OpenAPI artifacts are vendored go-openapi Go libraries, not a spec.
  http_reference:
    url: https://grafana.com/docs/loki/latest/reference/loki-http-api/
    gated: false
    endpoint_count: 40
  grpc:
    files:
      - grpc/grafana-loki-push.proto
      - grpc/grafana-loki-logproto.proto
      - grpc/grafana-loki-rules.proto
    services: [Pusher, Querier, StreamData]
    rpc_count: 14
    gated: false
  graphql:
    present: false
  mcp:
    url: https://mcp.grafana.com/mcp
    gated: true
    gate: 'HTTP 401 invalid_token — OAuth 2.1 bearer required for tools/list'
crosswalk:
  - tool: query_loki_logs
    category: Loki
    rest:
      - 'GET /loki/api/v1/query_range'
      - 'GET /loki/api/v1/query'
    grpc: ['Querier.Query', 'Querier.QuerySample']
    binding: direct
    confidence: high
    note: >-
      tools/loki.go builds a LogQL query with start/end/limit/direction/step and calls the Loki
      query endpoints; step is only sent for metric queries, matching query_range semantics.
  - tool: list_loki_label_names
    category: Loki
    rest: ['GET /loki/api/v1/labels']
    grpc: ['Querier.Label']
    binding: direct
    confidence: high
  - tool: list_loki_label_values
    category: Loki
    rest: ['GET /loki/api/v1/label/{name}/values']
    grpc: ['Querier.Label']
    binding: direct
    confidence: high
  - tool: query_loki_stats
    category: Loki
    rest: ['GET /loki/api/v1/index/stats']
    grpc: ['Querier.GetStats']
    binding: direct
    confidence: high
  - tool: query_loki_patterns
    category: Loki
    rest: ['GET /loki/api/v1/patterns']
    grpc: []
    binding: direct
    confidence: high
  - tool: analyze_loki_labels
    category: Loki
    rest:
      - 'GET /loki/api/v1/labels'
      - 'GET /loki/api/v1/label/{name}/values'
      - 'GET /loki/api/v1/index/stats'
    grpc: []
    binding: composite
    confidence: medium
    note: >-
      Documented as auditing a label strategy live or from a static config and diagnosing query
      performance; it reads the label and index surfaces. Mapped by documented behaviour, not by a
      confirmed call trace, because the live tool schema is auth-gated.
mcp_only:
  - tool: suggest_loki_alloy_label_config
    reason: >-
      Generates a Grafana Alloy `loki.process` configuration snippet. It produces configuration, not
      a Loki API call, and has no backing Loki HTTP or gRPC operation.
rest_only:
